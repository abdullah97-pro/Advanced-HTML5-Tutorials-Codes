<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Modal</title>
    <link rel="stylesheet" href="./imagemodal.css">
</head>
<body>
    <section class="gallery">
        <img src="./img/m1.jpg" alt="" class="gallery-item" onclick="openModal('modal1','PC1')">
        <img src="./img/m2.jpg" alt="" class="gallery-item" onclick="openModal('modal2','PC2')">
        <img src="./img/m3.jpg" alt="" class="gallery-item" onclick="openModal('modal3','PC3')">
        <img src="./img/m4.jpg" alt="" class="gallery-item" onclick="openModal('modal4','PC4')">
    </section>

    <section id="modal1" class="modal">
        <span class="close" onclick="">&times;</span>
        <img src="./img/m1.jpg" alt="" class="modal-content">
        <div class="caption"></div>
    </section>
    <section id="modal2" class="modal">
        <span class="close" onclick="">&times;</span>
        <img src="./img/m2.jpg" alt="" class="modal-content">
        <div class="caption"></div>
    </section>
    <section id="modal3" class="modal">
        <span class="close" onclick="">&times;</span>
        <img src="./img/m3.jpg" alt="" class="modal-content">
        <div class="caption"></div>
    </section>
    <section id="modal4" class="modal">
        <span class="close" onclick="">&times;</span>
        <img src="./img/m4.jpg" alt="" class="modal-content">
        <div class="caption"></div>
    </section>

    <script>
        function openModal(modalid, caption) {
            let modal = document.getElementById(modalid);
            modal.style.display = "flex";
            modal.classList.add("show");
            let message = modal.querySelector(".caption");
            message.innerText = caption;
        }
    </script>
</body>
</html>
